# options specified here will apply to all posts in this folder

# prevents posts from re-rendering unless explicitly told to do so (for more, see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: auto

# plain title blocks, to match the home page (see https://quarto.org/docs/authoring/title-blocks.html)
title-block-banner: false

# default for the Posts listing sort; set `pinned: true` in a post to put it first
pinned: false
